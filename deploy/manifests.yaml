# ============================================================
# Lane Scheduler — Kubernetes manifests
# ============================================================
#
# Apply with:
#   kubectl create namespace lane-scheduler
#   kubectl apply -f deploy/manifests.yaml
#
# Node setup:
#   Label and taint GPU nodes before deploying:
#     kubectl label nodes <gpu-node> gpu-class=medium
#     kubectl taint nodes <gpu-node> gpu-class=medium:NoSchedule

---
# ============================================================
# RBAC
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lane-scheduler
  namespace: lane-scheduler

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lane-scheduler
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lane-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lane-scheduler
subjects:
  - kind: ServiceAccount
    name: lane-scheduler
    namespace: lane-scheduler

---
# ============================================================
# Controller Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lane-scheduler
  namespace: lane-scheduler
  labels:
    app: lane-scheduler
spec:
  replicas: 1   # Must be 1 — scheduler holds in-memory state
  selector:
    matchLabels:
      app: lane-scheduler
  template:
    metadata:
      labels:
        app: lane-scheduler
    spec:
      serviceAccountName: lane-scheduler
      # Run on a control-plane node or an untainted management node
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: scheduler
          image: ghcr.io/agt/lane-scheduler:latest
          args:
            - --log-level=INFO
          env:
            - name: LANE_CYCLE_INTERVAL
              value: "10"
            - name: LANE_DISPATCH_K
              value: "8"
            - name: LANE_T_HALF_INTERACTIVE
              value: "600"
            - name: LANE_T_HALF_BATCH
              value: "7200"
            - name: LANE_USER_LABEL
              value: "dsmlp/user"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

---
