# ============================================================
# Lane Scheduler — Kubernetes manifests
# ============================================================
#
# Apply with:
#   kubectl apply -f rbac.yaml
#   kubectl apply -f controller-deployment.yaml
#
# Node setup:
#   Taint ALL managed nodes before deploying:
#     kubectl taint nodes <node> dsmlp/scheduling-gate=controller:NoSchedule
#
#   Label GPU nodes with their GPU class (xsmall|small|medium|large|xlarge),
#   and taint them so only pods carrying the matching gpu-class toleration
#   land there:
#     kubectl label nodes <gpu-node> gpu-class=medium
#     kubectl taint nodes <gpu-node> gpu-class=medium:NoSchedule

---
# ============================================================
# RBAC
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lane-scheduler
  namespace: lane-scheduler

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lane-scheduler
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lane-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lane-scheduler
subjects:
  - kind: ServiceAccount
    name: lane-scheduler
    namespace: lane-scheduler

---
# ============================================================
# Course CSV — mounted as a ConfigMap (replaced daily by a CronJob)
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: lane-courses
  namespace: lane-scheduler
data:
  courses.csv: |
    course_id,level,seats
    CSE101_SP26_A00,lower,210
    CSE150_SP26_A00,upper,55
    CSE234_SP26_A00,graduate,18

---
# ============================================================
# Controller Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lane-scheduler
  namespace: lane-scheduler
  labels:
    app: lane-scheduler
spec:
  replicas: 1   # Must be 1 — scheduler holds in-memory state
  selector:
    matchLabels:
      app: lane-scheduler
  template:
    metadata:
      labels:
        app: lane-scheduler
    spec:
      serviceAccountName: lane-scheduler
      # Run on a control-plane node or an untainted management node
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: scheduler
          image: ghcr.io/agt/lane-scheduler:latest
          args:
            - --log-level=INFO
          env:
            - name: LANE_CYCLE_INTERVAL
              value: "10"
            - name: LANE_DISPATCH_K
              value: "8"
            - name: LANE_T_HALF_INTERACTIVE
              value: "600"
            - name: LANE_T_HALF_BATCH
              value: "7200"
            - name: LANE_COURSE_CSV
              value: /etc/lane-scheduler/courses.csv
            - name: LANE_RELOAD_INTERVAL
              value: "86400"
          volumeMounts:
            - name: courses
              mountPath: /etc/lane-scheduler
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: courses
          configMap:
            name: lane-courses

---
# ============================================================
# Daily CSV reload CronJob
# Replaces the ConfigMap data from an external registrar export.
# Adjust the command to pull from your actual source.
# ============================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lane-course-reload
  namespace: lane-scheduler
spec:
  schedule: "0 6 * * *"   # 06:00 daily
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: lane-scheduler
          restartPolicy: OnFailure
          containers:
            - name: reload
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  # Replace with your actual fetch command, e.g.:
                  # curl -sf https://registrar.ucsd.edu/export/lane-courses.csv \
                  #   -o /tmp/courses.csv
                  #
                  # Then update the ConfigMap:
                  kubectl create configmap lane-courses \
                    --from-file=courses.csv=/tmp/courses.csv \
                    --dry-run=client -o yaml \
                    | kubectl apply -f -

---
